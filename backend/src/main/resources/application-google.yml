# local,google veya container,google ile etkinleşir; sağlayıcının protokol varsayılanlarını Spring Boot sağlar.
# Gizli değerler yalnızca backend ortamından gelir. Callback frontend proxy’sinin sabit origin’idir.
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: http://localhost:5173/login/oauth2/code/google

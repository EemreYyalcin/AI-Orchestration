# ai profili gerçek OpenAI ChatModel’i açar; geçerli API anahtarı ve hesabın erişebildiği model adı gerekir.
# İletişim/SDK tekrarı kapalıdır; şema advisor’ı, anlamsal servis ve Activity tekrarları ayrı katmanlardır.
spring:
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${AI_CHAT_MODEL}
      timeout: 20s
      max-retries: 0
    retry:
      max-attempts: 1

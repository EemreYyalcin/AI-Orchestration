# temporal profili backend sürecindeki worker’a deterministik workflow ve dış işi yapan Activity bean’ini bağlar.
# Namespace/kuyruk sabittir. PT1H ISO-8601 biçiminde bir saatlik kalıcı onay bekleme varsayılanıdır.
spring:
  temporal:
    namespace: default
    connection:
      target: ${TEMPORAL_ADDRESS:localhost:7233}
    workers:
      - task-queue: incident-investigations-v1
        name: investigation-worker
        workflow-classes:
          - dev.orchestrationlab.incident.workflow.InvestigationWorkflowImpl
        activity-beans:
          - investigationActivities
app:
  workflow:
    approval-timeout: ${APPROVAL_TIMEOUT:PT1H}

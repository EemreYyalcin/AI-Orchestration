# Compose içindeki backend ayarları: host adları özel Docker ağındaki servis adlarıdır.
server:
  address: 0.0.0.0
  port: 8080
  servlet:
    session:
      cookie:
        secure: false # Yalnızca yerel HTTP; production TLS ortamında true olmalıdır.
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
app:
  # Temel yapılandırmadaki isteğe bağlı kabul ayarını bu profil açıkça etkinleştirir.
  rate-limit:
    enabled: true
  mcp:
    documentation-url: http://documentation-mcp-server:8081

# Ortak varsayılanlar; etkin application-<profil>.yml dosyaları bunları geçersiz kılabilir.
# HttpSession yalnızca çerezle izlenir; HttpOnly JavaScript erişimini kapatır, Secure HTTPS ister.
server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        path: /
        secure: true

spring:
  # Dış modeller ve MCP otomatik istemcisi varsayılan kapalıdır; profil/Java adaptörleri bilinçli açar.
  ai:
    mcp:
      client:
        enabled: false
    model:
      chat: none
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
  application:
    name: ai-incident-orchestrator
  jpa:
    # Hibernate şema üretmez, Flyway’in oluşturduğu şemayı doğrular; HTTP render boyunca transaction tutulmaz.
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

management:
  # HTTP sağlık ayrıntıları gizlidir. Readiness yalnızca DB’yi kapsar; Redis/MCP/Temporal sağlığı değildir.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        readiness:
          include: db

app:
  # Redis kabulü varsayılan isteğe bağlıdır; container profili enabled=true ile bunu etkinleştirir.
  rate-limit:
    enabled: ${INVESTIGATION_RATE_LIMIT_ENABLED:false}
    limit: ${INVESTIGATION_RATE_LIMIT:5}
    window: ${INVESTIGATION_RATE_WINDOW:PT1M}

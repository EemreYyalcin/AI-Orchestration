# Docker DNS’ini yeniden çözerek backend container yeniden başlatmalarını karşılar.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream incident_backend {
    zone incident_backend 64k;
    server backend:8080 resolve;
}
server {
    # Statik React paketi; bilinmeyen istemci yolları index.html üzerinden SPA’ya gider.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
    # API ve Google protokol yollarında Host korunur; tarayıcı çerez/CSRF ile aynı origin kullanır.
    location /api/ { proxy_pass http://incident_backend; proxy_set_header Host $http_host; }
    location /oauth2/ { proxy_pass http://incident_backend; proxy_set_header Host $http_host; }
    location /login/ { proxy_pass http://incident_backend; proxy_set_header Host $http_host; }
    location = /logout { proxy_pass http://incident_backend; proxy_set_header Host $http_host; }
}
